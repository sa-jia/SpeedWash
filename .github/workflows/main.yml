name: Sync & Deploy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        id: check
        run: |
          git remote add upstream https://github.com/mejorhablemos/SpeedWash.git
          git fetch upstream
          
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$REMOTE" ]; then
            git merge upstream/main --no-edit --allow-unrelated-histories || {
              git checkout --theirs .
              git add .
              git commit --no-edit -m "Merge upstream (resolve conflicts)"
            }
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # cache: 'npm'

      - name: Create .env.production
        run: |
          echo "VITE_API_BASE_URL=/api" > .env.production
          echo "VITE_USER_SCAN_URL=https://lavar.speedwash.com.ar" >> .env.production

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      
      - name: Upload to temp directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_PATH }}_new
          strip_components: 1
          overwrite: true

      - name: Atomic swap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            DEPLOY=${{ secrets.DEPLOY_PATH }}
            DEPLOY="${DEPLOY%/}"
            rm -rf "${DEPLOY}_old"
            mv "$DEPLOY" "${DEPLOY}_old" 2>/dev/null || true
            mv "${DEPLOY}_new" "$DEPLOY"
            rm -rf "${DEPLOY}_old"
